name: Release

on:
  push:
    branches: ["live"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # write findings to github
      contents: write # create a new release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate d2 diagram
        shell: bash
        run: |
          go install oss.terrastruct.com/d2@latest
          ~/go/bin/d2 architecture.d2 architecture.svg

      - name: Generate timestamp tag
        id: timestamp
        run: |
          echo "tag_name=$(date +'%Y%m%d%H%M%S%3N')" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: architecture.svg
          append_body: true
          body: "![architecture.svg](https://github.com/secureblue/architecture/releases/download/${{ steps.timestamp.outputs.tag_name}}/architecture.svg)"
          tag_name: ${{ steps.timestamp.outputs.tag_name }}
